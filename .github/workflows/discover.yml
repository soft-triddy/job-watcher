name: discover

# Поиск карьерных страниц для новых компаний. Стартует сам, когда меняется discover/input.csv,
# или вручную (Run workflow).
on:
  push:
    paths:
      - discover/input.csv
  workflow_dispatch:
    inputs:
      only:
        description: "Только эти компании (через пробел). Пусто = все."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: run
        run: |
          if [ "$(wc -l < discover/input.csv)" -le 1 ]; then echo "input.csv пуст"; exit 0; fi
          python discover.py ${{ github.event.inputs.only }} 2>&1 | tee discover/log.txt
      - name: save result
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add discover/result.csv discover/log.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to save"; exit 0
          fi
          git commit -m "discover result [skip ci]"
          git pull --rebase --autostash origin main
          git push
