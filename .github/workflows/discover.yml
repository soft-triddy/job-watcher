name: discover

# Поиск карьерных страниц для новых компаний. Стартует сам, когда меняется discover/input.csv,
# или вручную (Run workflow).
on:
  push:
    paths:
      - discover/input.csv
  workflow_dispatch:
    inputs:
      only:
        description: "Только эти компании (через пробел). Пусто = все."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - name: install browser
        # 11.11 установка упала на сбое DNS у зеркала Ubuntu на раннере GitHub — повторяем до 3 раз
        run: |
          for i in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "!! установка браузера: попытка $i не удалась"; sudo apt-get update -qq || true; sleep 30
          done
          exit 1
      - name: run
        run: |
          if [ "$(wc -l < discover/input.csv)" -le 1 ]; then echo "input.csv пуст"; exit 0; fi
          python discover.py ${{ github.event.inputs.only }} 2>&1 | tee discover/log.txt
      - name: save result
        if: always()
        run: bash save_state.sh "discover result [skip ci]" discover/result.csv discover/log.txt
