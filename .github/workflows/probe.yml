name: probe

# Перебор ATS по названию для компаний, которые радар не видит полноценно
# (LinkedIn-списки, текстовый режим, сломанные страницы). Только вручную. Результат —
# discover/probe_result.csv; списки радара не меняет.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Только эти компании (через пробел). Пусто = все."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: run
        run: python probe_ats.py ${{ github.event.inputs.only }} 2>&1 | tee discover/probe_log.txt
      - name: save result
        if: always()
        run: bash save_state.sh "probe result [skip ci]" discover/probe_result.csv discover/probe_log.txt
