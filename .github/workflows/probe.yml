name: probe

# Перебор ATS по названию для компаний, которые радар не видит полноценно
# (LinkedIn-списки, текстовый режим, сломанные страницы). Только вручную. Результат —
# discover/probe_result.csv; списки радара не меняет.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Только эти компании (через пробел). Пусто = все."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: run
        run: python probe_ats.py ${{ github.event.inputs.only }} 2>&1 | tee discover/probe_log.txt
      - name: save result
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add discover/probe_result.csv discover/probe_log.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to save"; exit 0
          fi
          git commit -m "probe result [skip ci]"
          git pull --rebase --autostash origin main
          git push
