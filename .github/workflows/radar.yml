name: job-radar

on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC = 11:00 по Бишкеку. Меняешь тут при желании (время в UTC!)
  workflow_dispatch:          # даёт кнопку "Run workflow" для запуска вручную

permissions:
  contents: write             # нужно, чтобы бот мог сохранять seen.json/slugs.json обратно в репозиторий

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: run radar
        run: python radar.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

      - name: save state
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add seen.json slugs.json || true
          git commit -m "update state [skip ci]" || echo "no changes to save"
          git push
