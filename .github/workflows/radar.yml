name: job-radar

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Слепок: прислать ВСЕ текущие подходящие вакансии с оценками, а не только новые"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: run
        run: if [ "$ALL" = "true" ]; then python radar.py --all; else python radar.py; fi
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALL: ${{ github.event.inputs.all }}
          SCORER_MAX: ${{ github.event.inputs.all == 'true' && '250' || '40' }}
          SCORER_BUDGET: ${{ github.event.inputs.all == 'true' && '2700' || '900' }}
      - name: save state
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to save"; exit 0
          fi
          git commit -m "state [skip ci]"
          git pull --rebase --autostash origin main
          git push
