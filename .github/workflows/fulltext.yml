name: fulltext

# Разово: полные тексты и даты публикации вакансий из discover/oct_items.json -> discover/oct_fulltext.json
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: run
        run: python fulltext.py
      - name: save result
        if: always()
        run: bash save_state.sh "fulltext [skip ci]" discover/oct_fulltext.json
