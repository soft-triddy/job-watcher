name: content-sweep

# Разовый сбор для коллеги: контент-роли Senior+ со всех источников радара -> discover/content_sweep.csv.
# В Telegram ничего не шлёт, seen и отчёты здоровья не трогает.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: run
        run: python content_sweep.py
      - name: save result
        if: always()
        run: bash save_state.sh "content sweep [skip ci]" discover/content_sweep.csv
