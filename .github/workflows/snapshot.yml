name: snapshot

# Слепок всех открытых маркетинговых вакансий со всех источников, с описаниями -> discover/snapshot.json.
# Без оценщика и без Telegram; seen и отчёты здоровья не трогает. Разбор делает Claude по файлу.
on:
  workflow_dispatch:
    inputs:
      role:
        description: "Чьи вакансии: marketing (Настя) или разовый слепок для знакомых"
        type: choice
        options: [marketing, ios, am, artem]
        default: marketing

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - name: install browser
        # 11.11 установка упала на сбое DNS у зеркала Ubuntu на раннере GitHub — повторяем до 3 раз
        run: |
          for i in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "!! установка браузера: попытка $i не удалась"; sudo apt-get update -qq || true; sleep 30
          done
          exit 1
      - name: run
        run: python snapshot.py
        env:
          ROLE: ${{ github.event.inputs.role }}
      - name: save result
        if: always()
        run: bash save_state.sh "snapshot [skip ci]" discover/snapshot*.json
