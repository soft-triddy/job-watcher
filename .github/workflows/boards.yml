name: boards

# Хабр Карьера + hh (только вакансии вне России), маркетинг. Опрос каждые 4 часа.
# Первый запуск — слепок всех текущих.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Слепок: прислать ВСЕ текущие подходящие вакансии с оценками, а не только новые"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: boards
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: run
        run: |
          if [ -f state/seen_boards.json ] && [ "$ALL" != "true" ]; then python boards_radar.py; else python boards_radar.py --all; fi
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HH_TOKEN: ${{ secrets.HH_TOKEN }}
          ALL: ${{ github.event.inputs.all }}
          SCORER_MAX: ${{ github.event.inputs.all == 'true' && '250' || '60' }}
          SCORER_BUDGET: ${{ github.event.inputs.all == 'true' && '1500' || '900' }}
      - name: save state
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to save"; exit 0
          fi
          git commit -m "state boards [skip ci]"
          git pull --rebase --autostash origin main
          git push
