name: music-radar

# Отдельная проверка музтех-компаний: свои списки и seen-файлы, сообщения с пометкой 🎵.
on:
  schedule:
    - cron: "47 6 * * *"      # 12:47 Бишкек, между API- и браузерным радаром
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RADAR_TAG: "🎵 Музтех · "
      RADAR_COMPANIES: music_radar_companies.csv
      RADAR_STATE: seen_music.json
      RADAR_SLUGS: slugs_music.json
      BROWSER_COMPANIES: music_browser_companies.csv
      BROWSER_STATE: seen_music_browser.json
      SCORER_CONTEXT: >-
        All vacancies in this batch are at music-tech companies. Music-tech is the candidate's personal dream
        industry: here she also welcomes CRM/Lifecycle and English-language roles, so lower "dull" by about 2
        compared with the same role elsewhere (never below 0). Crypto/web3 music companies are acceptable here:
        never set stop="crypto" in this batch (betting and gamedev stop still apply). Fit and remote rules stay exactly the same.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      # первый запуск: сразу присылаем все текущие вакансии (с оценками), дальше только новые
      - name: api
        timeout-minutes: 30
        run: |
          if [ -f seen_music.json ]; then python radar.py; else python radar.py --all; fi
      - name: browser
        if: always()
        timeout-minutes: 50
        run: |
          if [ -f seen_music_browser.json ]; then python browser_radar.py; else python browser_radar.py --all; fi
      - name: save state
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add seen_music.json seen_music_browser.json slugs_music.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to save"; exit 0
          fi
          git commit -m "state music [skip ci]"
          git pull --rebase --autostash origin main
          git push
