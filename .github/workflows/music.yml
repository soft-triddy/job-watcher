name: music-radar

# Отдельная проверка музтех-компаний: свои списки и seen-файлы, сообщения с пометкой 🎵.
on:
  schedule:
    - cron: "47 6 * * *"      # 12:47 Бишкек, между API- и браузерным радаром
  workflow_dispatch:
    inputs:
      all:
        description: "Слепок: прислать ВСЕ текущие подходящие вакансии с оценками, а не только новые"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALL: ${{ github.event.inputs.all }}
      SCORER_MAX: ${{ github.event.inputs.all == 'true' && '250' || '40' }}
      SCORER_BUDGET: ${{ github.event.inputs.all == 'true' && '2700' || '900' }}
      RADAR_LABEL: "🎵 Музтех · ATS"
      BROWSER_LABEL: "🎵 Музтех · Браузер"
      RADAR_COMPANIES: lists/music_radar_companies.csv
      RADAR_STATE: state/seen_music.json
      RADAR_SLUGS: state/slugs_music.json
      RADAR_HEALTH: state/health_music_api.json
      RADAR_REJECTED: state/rejected_music_api.json
      RADAR_FALLBACK: state/api_fallback_music.csv
      BROWSER_EXTRA: state/api_fallback_music.csv
      BROWSER_HEALTH: state/health_music_browser.json
      BROWSER_REJECTED: state/rejected_music_browser.json
      BROWSER_COMPANIES: lists/music_browser_companies.csv
      BROWSER_STATE: state/seen_music_browser.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - name: install browser
        # 11.11 установка упала на сбое DNS у зеркала Ubuntu на раннере GitHub — повторяем до 3 раз
        run: |
          for i in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "!! установка браузера: попытка $i не удалась"; sudo apt-get update -qq || true; sleep 30
          done
          exit 1
      # первый запуск: сразу присылаем все текущие вакансии (с оценками), дальше только новые
      - name: api
        if: always()        # API браузер не нужен: сбой установки браузера не должен его пропускать
        timeout-minutes: 50
        run: |
          if [ -f state/seen_music.json ] && [ "$ALL" != "true" ]; then python radar.py; else python radar.py --all; fi
      - name: browser
        if: always()
        timeout-minutes: 80
        run: |
          if [ -f state/seen_music_browser.json ] && [ "$ALL" != "true" ]; then python browser_radar.py; else python browser_radar.py --all; fi
      - name: mbw
        if: always()
        timeout-minutes: 30
        run: |
          if [ -f state/seen_mbw.json ] && [ "$ALL" != "true" ]; then python mbw_radar.py; else python mbw_radar.py --all; fi
      - name: save state
        if: always()
        run: bash save_state.sh "state music [skip ci]" state/
