name: browser-radar

on:
  schedule:
    - cron: "30 5 * * *"      # 05:30 UTC = 11:30 по Бишкеку (на 30 мин позже API-радара, чтобы не толкались)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests playwright

      - run: python -m playwright install --with-deps chromium

      - name: run browser radar
        run: python browser_radar.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

      - name: save state
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add seen_browser.json || true
          git commit -m "browser state [skip ci]" || echo "no changes to save"
          git push
