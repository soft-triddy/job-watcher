name: browser-radar

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Слепок: прислать ВСЕ текущие подходящие вакансии с оценками, а не только новые"
        type: boolean
        default: false
      diag:
        description: "Диагностика вместо обычного прогона: 'broken' = все сломанные (основной + музтех), или имена через запятую. Пусто = обычный прогон."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: run
        run: |
          if [ -z "$DIAG" ] && [ "$ALL" = "true" ]; then python browser_radar.py --all
          elif [ -z "$DIAG" ]; then python browser_radar.py
          elif [ "$DIAG" = "broken" ]; then python browser_radar.py --diag
          else python browser_radar.py --diag "$DIAG"; fi
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIAG: ${{ github.event.inputs.diag }}
          ALL: ${{ github.event.inputs.all }}
          SCORER_MAX: ${{ github.event.inputs.all == 'true' && '250' || '40' }}
          SCORER_BUDGET: ${{ github.event.inputs.all == 'true' && '2700' || '900' }}
      - name: save state
        if: always()
        run: bash save_state.sh "state browser [skip ci]" state/
