name: browser-radar

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      diag:
        description: "Диагностика вместо обычного прогона: 'broken' = все сломанные (основной + музтех), или имена через запятую. Пусто = обычный прогон."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: run
        run: |
          if [ -z "$DIAG" ]; then python browser_radar.py
          elif [ "$DIAG" = "broken" ]; then python browser_radar.py --diag
          else python browser_radar.py --diag "$DIAG"; fi
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIAG: ${{ github.event.inputs.diag }}
      - name: save state
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to save"; exit 0
          fi
          git commit -m "state [skip ci]"
          git pull --rebase --autostash origin main
          git push
